name: Hello GitHub Actions
on:
  push:
    branches:
      - '**' # This tells GitHub to run on ANY branch push
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello from GitHub Actions!"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a
